<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Planner — AI Task Breakdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-black selection:text-white">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-30 shadow-xs">
        <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-mono font-bold text-sm">μ</div>
                <span class="font-mono font-bold tracking-tight text-base">micro-planner</span>
            </div>
            <div class="flex items-center space-x-3">
                <span id="streak-badge" class="text-xs font-mono bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    🔥 Streak: 0d
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow space-y-8">

        <!-- Input Section -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <label for="task-input" class="block text-sm font-semibold text-slate-900 mb-2">What task do you want to break down?</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="task-input" 
                    maxlength="200"
                    placeholder="e.g. Prepare for my system design interview" 
                    class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black focus:bg-white transition-all"
                    onkeydown="if(event.key === 'Enter') generatePlan()"
                >
                <button 
                    onclick="generatePlan()" 
                    id="generate-btn"
                    class="bg-black hover:bg-slate-800 text-white font-medium text-sm px-6 py-3 rounded-xl transition-all shadow-sm whitespace-nowrap cursor-pointer"
                >
                    Generate Steps
                </button>
            </div>
            <div class="flex justify-between items-center mt-3 text-xs text-slate-400 font-mono">
                <span>AI breaks any task into 5-minute micro-goals</span>
                <span id="char-count">0/200</span>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <div id="loading-state" class="hidden space-y-3">
            <div class="p-5 border border-slate-200 rounded-2xl bg-white animate-pulse h-16"></div>
            <div class="p-5 border border-slate-200 rounded-2xl bg-white animate-pulse h-16"></div>
        </div>

        <!-- Error Box -->
        <div id="error-box" class="hidden p-4 border border-red-200 bg-red-50 text-red-800 rounded-xl text-sm flex justify-between items-center">
            <span id="error-message">An error occurred.</span>
            <button onclick="generatePlan()" class="underline font-semibold ml-2">Try again</button>
        </div>

        <!-- Active Plan Section -->
        <section id="plan-section" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-xs font-mono text-indigo-600 uppercase tracking-wider font-semibold">Active Plan</span>
                        <h2 id="current-task-title" class="font-bold text-slate-900 text-lg mt-0.5"></h2>
                    </div>
                    <span id="progress-text" class="text-xs font-mono text-slate-500 font-bold">0/0 done</span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-black h-full w-0 transition-all duration-500 rounded-full"></div>
                </div>
            </div>

            <div id="goals-list" class="space-y-3"></div>
        </section>

        <!-- Empty State with Example Tasks -->
        <section id="empty-state" class="border border-dashed border-slate-300 rounded-2xl p-10 text-center bg-white shadow-xs">
            <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-mono text-sm">💡</div>
            <h3 class="text-sm font-semibold text-slate-900 mb-1">No active micro-plan</h3>
            <p class="text-xs text-slate-500 mb-6 max-w-sm mx-auto">Type any big task above or pick one of these examples to test:</p>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="selectExample('Prepare for my system design interview')" class="text-xs border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-xl transition-all shadow-xs cursor-pointer">
                    ⚡️ System design interview prep
                </button>
                <button onclick="selectExample('Draft my quarterly business report')" class="text-xs border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-xl transition-all shadow-xs cursor-pointer">
                    📊 Draft quarterly report
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 font-mono bg-white">
        Micro-Planner — Powered by Groq API
    </footer>

    <!-- Load Local Secret Config First -->
    <script src="config.js"></script>

    <!-- Application Logic Script -->
    <script>
        let state = { task: '', goals: [], streak: 0, lastActiveDate: null };
        let activeTimer = null;
        let activeTimerIndex = null;
        let timeLeft = 300;

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('micro_planner_standalone_state');
            if (saved) { try { state = JSON.parse(saved); } catch(e) {} }
            checkStreak();
            updateUI();

            document.getElementById('task-input').addEventListener('input', (e) => {
                document.getElementById('char-count').innerText = `${e.target.value.length}/200`;
            });
        });

        function saveState() {
            localStorage.setItem('micro_planner_standalone_state', JSON.stringify(state));
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (state.lastActiveDate) {
                const last = new Date(state.lastActiveDate);
                const diffDays = Math.ceil(Math.abs(new Date(today) - last) / (1000 * 60 * 60 * 24));
                if (diffDays > 1) state.streak = 0;
            }
            document.getElementById('streak-badge').innerText = `🔥 Streak: ${state.streak}d`;
        }

        function selectExample(taskText) {
            document.getElementById('task-input').value = taskText;
            document.getElementById('char-count').innerText = `${taskText.length}/200`;
            generatePlan();
        }

        async function generatePlan() {
            // Automatically grab key from config.js
            const apiKey = typeof CONFIG !== 'undefined' ? CONFIG.GROQ_API_KEY : '';
            if (!apiKey) {
                alert('API key missing! Make sure config.js is created with your GROQ_API_KEY.');
                return;
            }

            const taskInput = document.getElementById('task-input');
            const taskText = taskInput.value.trim();
            if (!taskText) return;

            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('plan-section').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('generate-btn').disabled = true;

            const systemPrompt = "You are an expert productivity assistant. Return ONLY a valid JSON array of 4 to 8 objects. Each object must have keys: 'title' (string, starts with an action verb, takes about 5 minutes), 'minutes' (number, always 5), and 'difficulty' ('easy' | 'medium' | 'hard'). Order them logically with the easiest step first. No markdown fences, output raw JSON only.";

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: 'openai/gpt-oss-20b',
                        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: `Task to break down: ${taskText}` }],
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const rawText = data.choices[0].message.content;
                const cleanedJSON = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsedGoals = JSON.parse(cleanedJSON);

                if (!Array.isArray(parsedGoals) || parsedGoals.length === 0) throw new Error('Invalid JSON structure.');

                state.task = taskText;
                state.goals = parsedGoals.map(g => ({ ...g, completed: false }));
                saveState();
                updateUI();

            } catch (err) {
                console.error(err);
                document.getElementById('error-message').innerText = `Failed to generate plan: ${err.message}`;
                document.getElementById('error-box').classList.remove('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('generate-btn').disabled = false;
            }
        }

        function updateUI() {
            if (!state.goals || state.goals.length === 0) {
                document.getElementById('plan-section').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('plan-section').classList.remove('hidden');
            document.getElementById('current-task-title').innerText = state.task;

            const completedCount = state.goals.filter(g => g.completed).length;
            const totalCount = state.goals.length;
            document.getElementById('progress-text').innerText = `${completedCount}/${totalCount} done`;
            document.getElementById('progress-bar').style.width = `${(completedCount / totalCount) * 100}%`;

            const listEl = document.getElementById('goals-list');
            listEl.innerHTML = '';

            state.goals.forEach((goal, idx) => {
                const isTimerActive = (activeTimerIndex === idx);
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                const badgeColors = {
                    easy: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    medium: 'bg-blue-50 text-blue-700 border-blue-200',
                    hard: 'bg-purple-50 text-purple-700 border-purple-200'
                }[goal.difficulty] || 'bg-slate-100 text-slate-700 border-slate-200';

                const itemHTML = `
                    <div class="p-4 border rounded-2xl bg-white transition-all shadow-xs flex items-center justify-between gap-4 ${goal.completed ? 'border-emerald-200 bg-emerald-50/20 opacity-75' : 'border-slate-200 hover:border-slate-300'}">
                        <div class="flex items-center space-x-3.5 flex-grow">
                            <input type="checkbox" ${goal.completed ? 'checked' : ''} onchange="toggleGoal(${idx})" class="w-5 h-5 rounded-md border-slate-300 text-black focus:ring-black cursor-pointer accent-black shrink-0">
                            <span class="text-sm font-medium transition-all ${goal.completed ? 'line-through text-slate-400' : 'text-slate-900'}">${goal.title}</span>
                        </div>
                        <div class="flex items-center space-x-2.5 font-mono text-xs shrink-0">
                            <span class="px-2.5 py-1 rounded-full border text-[11px] font-medium capitalize ${badgeColors}">${goal.difficulty}</span>
                            <span class="text-slate-500 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-200">⏱️ ${goal.minutes}m</span>
                            <button onclick="toggleTimer(${idx})" class="px-3 py-1.5 rounded-full border transition-all font-medium cursor-pointer ${isTimerActive ? 'bg-black text-white border-black animate-pulse' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-700'}">
                                ${isTimerActive ? `⏳ ${timeStr}` : 'Start Timer'}
                            </button>
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        function toggleGoal(idx) {
            state.goals[idx].completed = !state.goals[idx].completed;
            const completedCount = state.goals.filter(g => g.completed).length;
            if (completedCount === state.goals.length) {
                const today = new Date().toDateString();
                if (state.lastActiveDate !== today) {
                    state.streak += 1;
                    state.lastActiveDate = today;
                }
            }
            saveState();
            updateUI();
        }

        function toggleTimer(idx) {
            if (activeTimerIndex === idx) {
                clearInterval(activeTimer);
                activeTimer = null;
                activeTimerIndex = null;
                timeLeft = 300;
            } else {
                if (activeTimer) clearInterval(activeTimer);
                activeTimerIndex = idx;
                timeLeft = (state.goals[idx].minutes || 5) * 60;
                
                activeTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(activeTimer);
                        alert(`Time is up for: ${state.goals[idx].title}!`);
                        activeTimer = null;
                        activeTimerIndex = null;
                        timeLeft = 300;
                    }
                    updateUI();
                }, 1000);
            }
            updateUI();
        }
    </script>
</body>
</html>
